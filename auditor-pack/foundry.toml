[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = false
auto_detect_remappings = false

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/"
]
