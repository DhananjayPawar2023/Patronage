name: Goal 1 quality gates

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm install
      - run: npm run contracts:test
      - run: npm run contracts:coverage
      - run: pip install slither-analyzer solc-select
      - run: solc-select install 0.8.24 && solc-select use 0.8.24
      - run: npx solhint 'contracts/**/*.sol'
      - run: slither contracts --config-file slither.config.json --fail-on none
